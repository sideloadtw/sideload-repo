name: Auto Sync All Apps

on:
  schedule:
    - cron: '0 4 * * *' # 每天早上 4:00 (UTC) 自動檢查更新
  workflow_dispatch:      # 支援手動一鍵點擊執行

jobs:
  sync-apps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Sync Apps
        run: |
          python -c "
          import json, urllib.request

          def get_json(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read().decode())

          try:
              with open('apps.json', 'r', encoding='utf-8') as f:
                  local_data = json.load(f)

              # 1. 同步 Feather
              try:
                  feather_data = get_json('https://raw.githubusercontent.com/khcrysalis/Feather/main/feather.json')
                  f_app = next((a for a in feather_data.get('apps', []) if a.get('bundleIdentifier') == 'thewonderofyou.Feather'), None)
                  if f_app:
                      for app in local_data.get('apps', []):
                          if app.get('bundleIdentifier') == 'thewonderofyou.Feather':
                              app['version'] = f_app.get('version', app['version'])
                              app['downloadURL'] = f_app.get('downloadURL', app['downloadURL'])
                              app['size'] = f_app.get('size', app['size'])
              except Exception as e:
                  print(f'Feather sync skipped: {e}')

              # 2. 同步 Glow for Facebook
              try:
                  fb_data = get_json('https://raw.githubusercontent.com/dvntm0/AltStore/main/feather.json')
                  fb_app = next((a for a in fb_data.get('apps', []) if a.get('bundleIdentifier') == 'com.facebook.Facebook'), None)
                  if fb_app:
                      for app in local_data.get('apps', []):
                          if app.get('bundleIdentifier') == 'com.facebook.Facebook':
                              app['version'] = fb_app.get('version', app['version'])
                              app['downloadURL'] = fb_app.get('downloadURL', app['downloadURL'])
                              app['size'] = fb_app.get('size', app['size'])
              except Exception as e:
                  print(f'Facebook sync skipped: {e}')

              # 3. 同步 RyukGram
              try:
                  ig_data = get_json('https://source.ryuksign.com/apps.json')
                  ig_app = next((a for a in ig_data.get('apps', []) if a.get('bundleIdentifier') == 'com.burbn.instagram'), None)
                  if ig_app:
                      for app in local_data.get('apps', []):
                          if app.get('bundleIdentifier') == 'com.burbn.instagram':
                              app['version'] = ig_app.get('version', app['version'])
                              app['downloadURL'] = ig_app.get('downloadURL', app['downloadURL'])
                              app['size'] = ig_app.get('size', app['size'])
              except Exception as e:
                  print(f'RyukGram sync skipped: {e}')

              with open('apps.json', 'w', encoding='utf-8') as f:
                  json.dump(local_data, f, indent=2, ensure_ascii=False)

          except Exception as err:
              print(f'Global error: {err}')
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync apps to latest release" && git push)
