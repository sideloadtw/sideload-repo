name: Auto Sync Apps

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # 每天 UTC 04:00 自動執行

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Sources
        run: |
          python3 -c "
          import json, urllib.request

          def get_json(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=15) as resp:
                  return json.loads(resp.read().decode())

          try:
              with open('apps.json', 'r', encoding='utf-8') as f:
                  local_data = json.load(f)

              # 1. Feather
              try:
                  f_data = get_json('https://raw.githubusercontent.com/khcrysalis/Feather/main/feather.json')
                  f_app = next((a for a in f_data.get('apps', []) if a.get('bundleIdentifier') == 'thewonderofyou.Feather'), None)
                  if f_app:
                      for app in local_data.get('apps', []):
                          if app.get('bundleIdentifier') == 'thewonderofyou.Feather':
                              app['version'] = f_app.get('version', app['version'])
                              app['downloadURL'] = f_app.get('downloadURL', app['downloadURL'])
                              app['size'] = f_app.get('size', app['size'])
                              if 'versions' in app and len(app['versions']) > 0:
                                  app['versions'][0]['version'] = app['version']
                                  app['versions'][0]['downloadURL'] = app['downloadURL']
                                  app['versions'][0]['size'] = app['size']
              except Exception as e:
                  print('Feather error:', e)

              # 2. Facebook (Glow)
              try:
                  fb_data = get_json('https://raw.githubusercontent.com/dvntm0/AltStore/main/feather.json')
                  fb_app = next((a for a in fb_data.get('apps', []) if a.get('bundleIdentifier') == 'com.facebook.Facebook'), None)
                  if fb_app:
                      for app in local_data.get('apps', []):
                          if app.get('bundleIdentifier') == 'com.facebook.Facebook':
                              app['version'] = fb_app.get('version', app['version'])
                              # 官方若有 versions[0] 優先取其下載鏈接
                              new_url = fb_app.get('downloadURL') or (fb_app.get('versions', [{}])[0].get('downloadURL') if fb_app.get('versions') else None)
                              if new_url:
                                  app['downloadURL'] = new_url
                              app['size'] = fb_app.get('size', app['size'])
                              if 'versions' in app and len(app['versions']) > 0:
                                  app['versions'][0]['version'] = app['version']
                                  app['versions'][0]['downloadURL'] = app['downloadURL']
                                  app['versions'][0]['size'] = app['size']
              except Exception as e:
                  print('FB error:', e)

              # 3. Instagram (RyukGram)
              try:
                  ig_data = get_json('https://source.ryuksign.com/plugins.json')
                  ig_app = next((a for a in ig_data.get('apps', []) if a.get('bundleIdentifier') == 'com.burbn.instagram'), None)
                  if ig_app:
                      for app in local_data.get('apps', []):
                          if app.get('bundleIdentifier') == 'com.burbn.instagram':
                              app['version'] = ig_app.get('version', app['version'])
                              new_url = ig_app.get('downloadURL') or (ig_app.get('versions', [{}])[0].get('downloadURL') if ig_app.get('versions') else None)
                              if new_url:
                                  app['downloadURL'] = new_url
                              app['size'] = ig_app.get('size', app['size'])
                              if 'versions' in app and len(app['versions']) > 0:
                                  app['versions'][0]['version'] = app['version']
                                  app['versions'][0]['downloadURL'] = app['downloadURL']
                                  app['versions'][0]['size'] = app['size']
              except Exception as e:
                  print('IG error:', e)

              with open('apps.json', 'w', encoding='utf-8') as f:
                  json.dump(local_data, f, indent=2, ensure_ascii=False)

          except Exception as err:
              print('Global error:', err)
          "

      - name: Commit & Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add apps.json
          git diff --quiet && git diff --staged --quiet || (git commit -m 'Auto-sync apps' && git push)
